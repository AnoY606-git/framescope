name: Prepare private preview release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0-preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PYTHONUTF8: '1'
    steps:
      - name: Validate tag syntax
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw 'Use an explicit semantic version tag.'
          }
      - name: Exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Match tag to source version
        id: source
        run: |
          . ./scripts/common.ps1
          if ($env:RELEASE_TAG -ne ('v' + (Get-FrameScopeVersion))) { throw 'Tag/version mismatch.' }
          $commit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'No exact source commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Local SDK and SHA-256-pinned per-user Inno Setup 6.5.4
        run: ./scripts/bootstrap.ps1 -InstallDotNet -InstallInno
      - name: Verify and package tagged sources without signing secrets
        run: ./scripts/package.ps1
      - name: Candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FrameScope-release-candidate
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-reports
          path: |
            artifacts/test-results/
            artifacts/verification.json
          if-no-files-found: warn
          retention-days: 14

  draft:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - name: Download only this run's candidate and verify checksums
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --name FrameScope-release-candidate --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed.' }
          $expected = @('SHA256SUMS')
          foreach ($line in Get-Content -LiteralPath candidate/SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (FrameScope-[0-9A-Za-z._-]+)$') { throw 'Invalid checksum entry.' }
            $digest, $name = $Matches[1], $Matches[2]
            if ($expected -contains $name) { throw 'Duplicate candidate file.' }
            $expected += $name
            if ((Get-FileHash -LiteralPath (Join-Path candidate $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
              throw 'Candidate checksum mismatch.'
            }
          }
          $actual = @(Get-ChildItem -LiteralPath candidate -File | ForEach-Object { $_.Name })
          if (Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)) { throw 'Unexpected candidate files.' }
          $manifests = @(Get-ChildItem -LiteralPath candidate -Filter '*-release.json')
          if ($manifests.Count -ne 1) { throw 'Expected one release manifest.' }
          $info = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($info.configuration -ne 'Release' -or $info.development_build) {
            throw 'Debug development packages cannot be published through the Release workflow.'
          }
          if (('v' + $info.version) -ne $env:RELEASE_TAG -or $info.source.commit -ne $env:SOURCE_COMMIT -or $info.source.dirty) {
            throw 'Release manifest does not match the tagged build.'
          }
          if (@($actual | Where-Object { $_ -like '*-setup.exe' }).Count -ne 1 -or
              @($actual | Where-Object { $_ -like '*-portable.zip' }).Count -ne 1 -or
              @($actual | Where-Object { $_ -like '*-source.zip' }).Count -ne 1) {
            throw 'Installer, portable and source archive are all required.'
          }
      - name: Create a draft only; never overwrite an existing release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath candidate -File | ForEach-Object { $_.FullName })
          $notes = 'Unsigned preview. Own Demo only; CS2 excluded. Present-call intervals are not displayed/FG FPS. Automated checks do not establish hardware compatibility; read the bundled docs/VERIFICATION.md and SHA256SUMS.'
          gh release create $env:RELEASE_TAG @files --draft --prerelease --verify-tag --title "FrameScope $($env:RELEASE_TAG) preview" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; existing releases are not replaced.' }
